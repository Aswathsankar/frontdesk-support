services:
  mysql:
    image: mysql:8.0
    container_name: frontdesk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: frontdesk
      MYSQL_USER: frontdesk
      MYSQL_PASSWORD: frontdesk
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      timeout: 10s
      retries: 10
      interval: 5s
      start_period: 30s

  app:
    build: .
    container_name: frontdesk-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: frontdesk
      DB_PASS: frontdesk
      DB_NAME: frontdesk
      JWT_SECRET: change-this-to-a-random-32-char-string
      PORT: "3000"
      TZ: UTC
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
